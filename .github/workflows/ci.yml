# Kötelező ellenőrzések minden változáson. Az ellenőrzések nevei (`teszt (ubuntu-latest)`,
# `csomag (windows-latest)`, és a szerzo-kapu.yml `szerzo` neve) rögzítettek: az ágvédelem
# ezekre hivatkozik, ne nevezd át őket.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Ugyanaz a verzió, mint a rust-toolchain.toml-ban.
  RUSTUP_TOOLCHAIN: "1.100.0"
  GITLEAKS_VERZIO: "8.30.1"
  # A hivatalos kiadás ellenőrzőösszege (gitleaks_8.30.1_checksums.txt, linux_x64).
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  teszt:
    name: teszt (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust eszközlánc
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustc --version

      - name: Külső eszközök (rögzített verzió)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.1,cargo-llvm-cov@0.9.2

      - name: Cargo-gyorsítótár
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ubuntu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ubuntu-

      - name: Formázás
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tesztek
        run: cargo test --workspace --locked

      - name: Licenc, biztonság, tiltások, források
        run: cargo deny check licenses advisories bans sources

      - name: Titokkereső (gitleaks)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERZIO}/gitleaks_${GITLEAKS_VERZIO}_linux_x64.tar.gz"
          mappa="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$mappa/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  $mappa/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$mappa/gitleaks.tar.gz" -C "$mappa" gitleaks
          "$mappa/gitleaks" git --redact --no-banner --verbose .

      - name: Lefedettség (csak mér, küszöb nélkül)
        run: |
          cargo llvm-cov --workspace --locked --summary-only | tee lefedettseg.txt
          {
            echo "### Lefedettség (küszöb a 2. mérföldkőtől)"
            echo '```'
            tail -n 5 lefedettseg.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  csomag:
    name: csomag (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rust eszközlánc
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
          rustc --version

      - name: Cargo-gyorsítótár
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Clippy (idő mérve)
        shell: bash
        run: |
          start=$(date +%s)
          cargo clippy --workspace --all-targets --locked -- -D warnings
          echo "CLIPPY_MP=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Release build (idő mérve)
        shell: bash
        run: |
          start=$(date +%s)
          cargo build --release --workspace --locked
          echo "BUILD_MP=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Windows füstpróba
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $root = $env:RUNNER_TEMP
          $ures = Join-Path $root 'picarust-ures-keptar'
          $ekeztett = Join-Path $root 'Képek próba\árvíztűrő'
          $hianyzik = Join-Path $root 'picarust-nem-letezo-keptar'
          foreach ($ut in @($ures, $ekeztett, $hianyzik)) {
            Remove-Item -LiteralPath $ut -Recurse -Force -ErrorAction SilentlyContinue
          }
          [void][IO.Directory]::CreateDirectory($ures)
          [void][IO.Directory]::CreateDirectory($ekeztett)
          $bitmap = [System.Drawing.Bitmap]::new(8, 8)
          try {
            for ($i = 0; $i -lt 20; $i++) {
              $kep = Join-Path $ekeztett ('kep-{0:D2}.jpg' -f $i)
              $bitmap.Save($kep, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            }
          } finally {
            $bitmap.Dispose()
          }
          $exe = Join-Path $PWD 'target/release/picarust.exe'
          function Invoke-Smoke([string]$keptar) {
            $inditas = [System.Diagnostics.ProcessStartInfo]::new()
            $inditas.FileName = $exe
            $inditas.UseShellExecute = $false
            $inditas.ArgumentList.Add('--gyoker')
            $inditas.ArgumentList.Add($keptar)
            $folyamat = [System.Diagnostics.Process]::Start($inditas)
            if ($null -eq $folyamat) { throw 'A program nem indult el.' }
            try {
              Start-Sleep -Seconds 20
              if ($folyamat.HasExited) { throw 'A program 20 másodperc előtt kilépett.' }
              if (-not $folyamat.CloseMainWindow()) { throw 'Az ablak nem zárható be szabályosan.' }
              if (-not $folyamat.WaitForExit(5000)) { throw 'A program nem állt le a bezárás után.' }
              if ($folyamat.ExitCode -ne 0) { throw "Kilépési kód: $($folyamat.ExitCode)" }
            } finally {
              if (-not $folyamat.HasExited) {
                $folyamat.Kill()
                $folyamat.WaitForExit()
              }
              $folyamat.Dispose()
            }
          }
          Invoke-Smoke $ures
          Invoke-Smoke $ekeztett
          Invoke-Smoke $hianyzik

      - name: Mérési összefoglaló
        shell: bash
        run: |
          {
            echo "### Windows: mért idők"
            echo "- clippy: ${CLIPPY_MP} mp"
            echo "- release build: ${BUILD_MP} mp"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Csomag feltöltése
        uses: actions/upload-artifact@v7
        with:
          name: picarust-windows
          path: target/release/*.exe
          if-no-files-found: ignore
