[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Kulso csomag csak ide vehető fel, pontosan rogzitett (`=x.y.z`) verzioval.
# A lista az integratore: munkas nem modositja.
[workspace.dependencies]
slint = { version = "=1.14.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "compat-1-2",
] }
slint-build = "=1.14.1"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
thread-priority = "=3.1.1"
serde_json = "=1.0.154"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
