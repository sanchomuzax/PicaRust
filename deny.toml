# cargo-deny: licenc, ismert biztonsági hibák, tiltások, források.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
# Csak a GPL-3.0-val összeférő licencek; az ismeretlen licenc hiba.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
